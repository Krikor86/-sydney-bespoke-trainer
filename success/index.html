<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Thank You | Sydney Bespoke Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 70% 20%, rgba(255,90,31,.16), transparent 32%), #0a0c0e;
      color: #f3f0e9;
      font-family: "DM Sans", sans-serif;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(34px, 7vw, 64px);
      border: 1px solid rgba(255,90,31,.34);
      border-radius: 28px;
      background: rgba(21,24,27,.94);
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
      text-align: center;
    }
    .eyebrow {
      margin-bottom: 18px;
      color: #ff5a1f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(34px, 8vw, 58px);
      line-height: 1;
    }
    p {
      margin: 0 auto 30px;
      max-width: 460px;
      color: #b9bec4;
      font-size: 16px;
      line-height: 1.65;
    }
    a {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      border-radius: 999px;
      background: #ff5a1f;
      color: #090b0d;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-decoration: none;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Enquiry Received</div>
    <h1>THANK YOU.</h1>
    <p>Your message has been sent. Greg will be in touch within 24 hours to discuss your goals and arrange your free consultation.</p>
    <a href="/">Return to the Website</a>
  </main>
</body>
</html>
